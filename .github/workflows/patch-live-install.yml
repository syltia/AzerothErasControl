name: Apply live installer output patch

on:
  push:
    paths:
      - '.github/workflows/patch-live-install.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch installer streaming output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ember_admin.py')
          text = path.read_text(encoding='utf-8')

          old = '''                _,stdout,stderr=self.ssh.exec_command(cmd,get_pty=True)
                output=stdout.read().decode(errors="replace")+stderr.read().decode(errors="replace")
                rc=stdout.channel.recv_exit_status()

                def finish():
                    if output.strip():
                        self.install_out.insert("end",output+"\\n")
'''

          new = '''                _,stdout,stderr=self.ssh.exec_command(cmd,get_pty=True)
                channel=stdout.channel

                while True:
                    if channel.recv_ready():
                        data=channel.recv(4096).decode("utf-8",errors="replace")
                        if data:
                            self.q.put(("install_log",data))
                    elif channel.exit_status_ready():
                        # Drain any bytes received together with the exit status.
                        while channel.recv_ready():
                            data=channel.recv(4096).decode("utf-8",errors="replace")
                            if data:
                                self.q.put(("install_log",data))
                        break
                    else:
                        import time
                        time.sleep(0.04)

                rc=channel.recv_exit_status()

                def finish():
'''

          if text.count(old) != 1:
              raise SystemExit(f'Installer target block count is {text.count(old)}, expected 1')
          text = text.replace(old, new, 1)

          old_drain = '''                elif t=="log":self.console.insert("end",v);self.console.see("end")
                elif t=="shell":self.console.insert("end",v);self.console.see("end")
                elif t=="monitor":
'''

          new_drain = '''                elif t=="log":self.console.insert("end",v);self.console.see("end")
                elif t=="shell":self.console.insert("end",v);self.console.see("end")
                elif t=="install_log":
                    if hasattr(self,"install_out"):
                        self.install_out.insert("end",v)
                        self.install_out.see("end")
                elif t=="monitor":
'''

          if text.count(old_drain) != 1:
              raise SystemExit(f'Drain target block count is {text.count(old_drain)}, expected 1')
          text = text.replace(old_drain, new_drain, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile ember_admin.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-live-install.yml
          git add ember_admin.py
          git commit -m "Stream Debian installation output in real time"
          git push origin HEAD:main
